name: Backfill Yahoo Historical Data

on:
  workflow_dispatch:
    # 手動觸發，可以在 GitHub Actions 網頁端按下 Run workflow 啟動

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas pyarrow duckdb

      - name: Run Backfill Script
        run: |
          python scripts/backfill_yahoo_history.py
          
      # 程式內已經有自動 git commit 機制，但為了防止最後一次未上傳，這裡再補一次
      - name: Final Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto finish Yahoo backfill" && git push)
