name: 📊 每週抓股權分散表

on:
  schedule:
    - cron: '0 1 * * 6'   # 每週六 09:00 台灣時間（UTC+8 → UTC 01:00）
  workflow_dispatch:          # 允許在 GitHub 網頁手動觸發

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # 允許 git push

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: 更新股票基本資料（每月快取）
        run: python scripts/fetch_meta.py

      - name: 抓取 TDCC 股權分散表（全市場一次搞定）
        run: python scripts/fetch_holders.py
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}

      - name: Commit & Push 資料
        run: |
          python scripts/update_index.py
          git config user.name "Data Bot 🤖"
          git config user.email "bot@noreply.github.com"
          git add data/
          git diff --staged --quiet || (
            git commit -m "📊 [auto] holders $(date +'%Y%m%d')" &&
            git push
          )
