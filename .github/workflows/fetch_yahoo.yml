name: Fetch Yahoo Broker Data

on:
  schedule:
    # 提早到台灣時間 16:30 (UTC 08:30) 觸發，防延遲，程式內部會等到 17:00 才抓
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape_yahoo:
    name: Scrape Yahoo Finance
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyarrow yfinance
          
      - name: Fetch Yahoo Brokers
        run: |
          python scripts/fetch_yahoo_brokers.py
          
      - name: Fetch Capital Events (Splits)
        run: |
          python scripts/fetch_capital_events.py
          
      - name: Fetch TDCC Holders
        run: |
          python scripts/fetch_holders.py
          
      - name: Build Per-Stock Holders History JSONs
        run: |
          python scripts/build_holders_history.py
          
      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update Yahoo broker data [skip ci]"
            git pull --rebase origin master
            git push origin master
          fi
