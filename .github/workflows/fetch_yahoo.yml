name: Fetch Yahoo Broker Data

on:
  schedule:
    # 台灣時間 17:00 等於 UTC 09:00
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape_yahoo:
    name: Scrape Yahoo Finance
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyarrow
          
      - name: Fetch Yahoo Brokers
        run: |
          python scripts/fetch_yahoo_brokers.py
          
      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/brokers/
          git add data/index.json
          git add data/brokers_history.parquet
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update Yahoo broker data [skip ci]"
            git push
          fi
